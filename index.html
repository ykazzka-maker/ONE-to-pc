<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator" aria-label="Калькулятор">
      <div class="display">
        <div id="previous" class="previous">0</div>
        <div id="current" class="current">0</div>
      </div>

      <div class="buttons">
        <button class="clear" type="button" data-value="clear">C</button>
        <button class="delete" type="button" data-value="delete">⌫</button>
        <button class="operator" type="button" data-value="%">%</button>
        <button class="operator" type="button" data-value="/">/</button>

        <button type="button" data-value="7">7</button>
        <button type="button" data-value="8">8</button>
        <button type="button" data-value="9">9</button>
        <button class="operator" type="button" data-value="*">*</button>

        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
        <button type="button" data-value="6">6</button>
        <button class="operator" type="button" data-value="-">-</button>

        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>
        <button class="operator" type="button" data-value="+">+</button>

        <button class="zero" type="button" data-value="0">0</button>
        <button type="button" data-value=".">.</button>
        <button class="equal" type="button" data-value="=">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
